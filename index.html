<style>*,*:before,*:after{box-sizing:border-box}html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden!important;overflow:clip!important;background:#0b0d14;color:#e6eaf5;top:auto!important;transform:none!important;overscroll-behavior:none;font-family:system-ui,-apple-system,Segoe UI,Noto Sans KR,Apple SD Gothic Neo,sans-serif;-webkit-text-size-adjust:100%}html.scroll-contain #root{touch-action:none}#root{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:absolute;pointer-events:none}.hud-text{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#e6eaf5;text-shadow:0 0 0 #0B0D14,1px 1px 0 #0B0D14,-1px -1px 0 #0B0D14,1px -1px 0 #0B0D14,-1px 1px 0 #0B0D14;font-size:clamp(11px,2.2vmin,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 56px}#hud-name{top:var(--name-top, 22px)}#hud-hint{bottom:var(--hint-bottom, 8px);opacity:1}#hud-hint:empty{display:none}.icon-btn{pointer-events:auto;position:absolute;right:4px;top:4px;width:44px;height:44px;border:2px solid #0B0D14;border-radius:6px;background:#2c3550;display:grid;place-items:center;cursor:pointer;padding:0}.icon-btn:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid #FFD335;outline-offset:2px}.pause-ic{width:14px;height:16px;border-left:5px solid #E6EAF5;border-right:5px solid #E6EAF5}.card{position:absolute;left:50%;transform:translate(-50%);text-align:center;pointer-events:none;background:#1c2233;border:2px solid #0B0D14;box-shadow:0 0 0 2px #46527a;padding:8px 18px;border-radius:4px;font-weight:700}.card p{margin:2px 0}.card .big{font-size:1.2em;color:#ffd335}.card.ready{bottom:18%}.card.fail{top:38%}.screen{position:absolute;inset nherit;font-weight:700;font-size:15px;color:#e6eaf5;background:#2c3550;border:2px solid #0B0D14;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.lv small{font-size:10px;color:#ffd335;letter-spacing:-1px}.lv.locked{opacity:.45;cursor:default}.lv.cur{background:#ffd335;color:#0b0d14}.lv.cur small{color:#0b0d14}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b0d14b8;padding:8px}.panel{background:#1c2233;border:2px solid #0B0D14;box-shadow:0 0 0 2px #46527a;border-radius:6px;padding:12px 16px;max-width:min(96vw,520px);max-height:calc(100% - 8px);text-align:center}.panel h2{margin:0 0 8px;font-size:20px}.panel p{margin:4px 0}.stars{font-size:28px;letter-spacing:4px;color:#ffd335;margin:0}.muted{color:#a3adcf;font-size:14px}.settings{text-align:left;width:min(96vw,460px)}.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;flex-wrap:wrap}.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.seg button{min-height:40px;padding:4px 10px;font:inherit;font-size:14px;color:#e6eaf5;background:#2c3550;border:2px solid #0B0D14;border-radius:4px;cursor:pointer}.seg button[aria-pressed=true]{background:#ffd335;color:#0b0d14}#set-close{width:100%;margin-top:8px}.ward-sec{background:#1c2233;border:2px solid #0B0D14;border-radius:4px;padding:6px 8px}.ward-sec h3{margin:0 0 6px;font-size:14px;color:#a3adcf}.ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}.ward-item{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:13px;color:#e6eaf5;background:#2c3550;border:2px solid #0B0D14;border-radius:4px;cursor:pointer;padding:4px}.ward-item canvas{width:36px;height:36px;image-rendering:pixelated}.ward-item.locked{opacity:.5;cursor:default}.ward-item[aria-pressed=true]{box-shadow:0 0 0 2px #ffd335}.ward-item small{color:#a3adcf;font-size:11px}.notice{position:absolute;left:50%;bottom:8px;transform:translate(-50%);background:#2c3550;border:2px solid #0B0D14;padding:6px 12px;border-radius:4px;font-size:13px;pointer-events:none;max-width:92vw;text-align:center}.ad-overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#000000d9}.ad-box{text-align:center}.ad-slot{width:240px;height:120px;display:grid;place-items:center;background:#46527a;margin:8px auto;font-weight:700}@media(max-height:420px)and (orientation:landscape){.hub-inner{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;column-gap:24px}#logo{width:min(44vw,300px)}.col{min-width:200px}.btn{min-height:40px;padding:6px 14px}.controls,.credits{width:100%}.lv{min-height:40px}.world h3{margin-bottom:4px}#map-worlds{gap:6px;padding-top:6px}.bar{padding-top:4px;padding-bottom:4px}}@media(prefers-reduced-motion:reduce){.btn:active{transform:none}}.share-line{margin:6px 0 0!important}

<body>
<div id="root">
  <div id="stage">
    <canvas id="game" aria-label="Game"></canvas>
    <div id="hud" hidden>
      <div id="hud-name" class="hud-text"></div>
      <div id="hud-hint" class="hud-text" aria-live="polite"></div>
      <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause"><span class="pause-ic"></span></button>
    </div>
    <div id="card-ready" class="card ready" hidden><p data-t="ui.start"></p></div>
    <div id="card-fail" class="card fail" hidden><p class="big" data-t="ui.fail"></p><p data-t="ui.fail.tap"></p></div>
  </div>
  <section id="screen-hub" class="screen" hidden>
    <div class="hub-inner">
      <canvas id="logo" width="120" height="24" aria-hidden="true"></canvas>
      <h1 id="app-name" class="sr"></h1>
      <p id="hub-totals" class="totals"></p>
      <div class="col">
        <button id="hub-play" class="btn primary" type="button"></button>
        <button id="hub-levels" class="btn" type="button" data-t="ui.levels"></button>
        <button id="hub-wardrobe" class="btn" type="button" data-t="ui.wardrobe"></button>
        <button id="hub-settings" class="btn" type="button" data-t="ui.settings"></button>
      </div>
      <p class="controls" data-t="ui.controls"></p>
      <p id="credits" class="credits"></p>
    </div>
  </section>
  <section id="screen-map" class="screen" hidden>
    <header class="bar"><button id="map-back" class="btn small" type="button" data-t="ui.back"></button><h2 data-t="ui.levels"></h2><span id="map-totals" class="totals"></span></header>
    <div id="map-worlds" class="scroll"></div>
  </section>
  <section id="screen-wardrobe" class="screen" hidden>
    <header class="bar"><button id="ward-back" class="btn small" type="button" data-t="ui.back"></button><h2 data-t="ui.wardrobe"></h2><span id="ward-totals" class="totals"></span></header>
    <div id="ward-list" class="scroll"></div>
  </section>
  <div id="card-result" class="overlay" hidden>
    <div class="panel result" role="dialog" aria-modal="true" aria-labelledby="res-title">
      <h2 id="res-title" data-t="ui.result.clear"></h2>
      <p id="res-stars" class="stars" aria-hidden="true"></p>
      <p id="res-time"></p><p id="res-best"></p><p id="res-extra" class="muted"></p>
      <p class="share-line"><button id="res-share" class="btn small" type="button" data-t="ui.share"></button></p>
      <div class="row"><button id="res-map" class="btn" type="button" data-t="ui.result.map"></button><button id="res-retry" class="btn" type="button" data-t="ui.result.retry"></button><button id="res-next" class="btn primary" type="button" data-t="ui.result.next"></button></div>
    </div>
  </div>
  <div id="overlay-pause" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true"><h2 data-t="ui.pause"></h2>
      <div class="col"><button id="pause-resume" class="btn primary" type="button" data-t="ui.resume"></button><button id="pause-restart" class="btn" type="button" data-t="ui.restart"></button><button id="pause-settings" class="btn" type="button" data-t="ui.settings"></button><button id="pause-map" class="btn" type="button" data-t="ui.result.map"></button></div>
    </div>
  </div>
  <div id="overlay-settings" class="overlay" hidden>
    <div class="panel settings scroll" role="dialog" aria-modal="true"><h2 data-t="ui.settings"></h2>
      <div class="set"><span data-t="ui.settings.language"></span><div class="seg" id="set-locale"><button type="button" data-v="en" data-t="ui.lang.en"></button><button type="button" data-v="ko" data-t="ui.lang.ko"></button></div></div>
      <div class="set"><span data-t="ui.settings.palette"></span><div class="seg wrap" id="set-palette"><button type="button" data-v="lantern" data-t="ui.settings.palette.lantern"></button><button type="button" data-v="okabe" data-t="ui.settings.palette.okabe"></button><button type="button" data-v="contrast" data-t="ui.settings.palette.contrast"></button></div></div>
      <div class="set"><span data-t="ui.settings.music"></span><div class="seg" id="set-music"><button type="button" data-v="1" data-t="ui.on"></button><button type="button" data-v="0" data-t="ui.off"></button></div></div>
      <div class="set"><span data-t="ui.settings.sfx"></span><div class="seg" id="set-sfx"><button type="button" data-v="1" data-t="ui.on"></button><button type="button" data-v="0" data-t="ui.off"></button></div></div>
      <div class="set"><span data-t="ui.settings.reduce"></span><div class="seg" id="set-reduce"><button type="button" data-v="system" data-t="ui.system"></button><button type="button" data-v="on" data-t="ui.on"></button><button type="button" data-v="off" data-t="ui.off"></button></div></div>
      <button id="set-close" class="btn primary" type="button" data-t="ui.close"></button>
    </div>
  </div>
  <div id="notice" class="notice" hidden></div>
</div>
<script>(()=>{var re={configVersion:"0.1.0",gameId:"arc2",codename:"arc2",status:"design draft 2026-11-10 KST - every number is [제안값(관측치 아님)] unless a 'source' field says otherwise",display:{displayName:"PROVISIONAL",note:"D2-01 name undecided; candidates in design-spec.md §13. Storage keys/events use 'arc2' only, never the display name."},units:{u:"1 world tile",time:"seconds",yAxis:"up",levelHeightU:20},physics:{model:"point mass + inextensible rope (taut-only distance constraint, slack allowed), position-based velocity update",dt:.008333333333333333,stepsPerSecond:120,maxSubstepsPerFrame:8,timeoutSteps:7200,gravity:30,airDrag:.05,maxSpeed:30,playerRadius:.4,grabRange:7,grabSelection:"nearest pin within range (fixed pins: within their own len); the pin released in the last regrabLockSteps (0.15 s) is skipped; exact tie -> larger x",holdBuffer:!0,ropeMin:1.5,ropeMax:7,reelRate:1.2,reelFloor:2.5,releaseBoost:1.04,padRestitution:1,padMinBounce:16,collectRadius:.6,zones:{lowg:{gScale:.45,label:"Feather field"},updraft:{gScale:-.6,label:"Updraft"},current:{gScale:1,ax:14,label:"Current (dir +1 right / -1 left)"},water:{gScale:.35,drag:1.4,label:"Tide water"}},determinism:{stepOrder:["sample input","release (boost)","hold-buffer grab","zone lookup","accel+drag","reel","integrate","rope projection + v=(p'-p)/dt","speed clamp","pads","hazards","collectible","goal","bounds"],allowedMath:["+","-","*","/","Math.sqrt","Math.min","Math.max"],forbiddenInStep:["Math.sin","Math.cos","Math.atan2","Math.pow","Math.random","Date.now"],movingPins:"triangle-wave ping-pong, integer periodSteps, exact rational parameter",seed:"levels are hand-authored and need no RNG. Daily course: mulberry32(fnv1a32('arc2-daily-'+YYYY-MM-DD UTC)). Visual effects use a separate non-gameplay stream."},regrabLockSteps:18},input:{button:"one: pointer down/up anywhere on the play area, Space, or Enter",pressSamplesAt:"next fixed-step boundary",retryKey:"same button on the fail card (300 ms input lock)",pauseKey:"Esc / P / pause icon (outside play area)",inputLog:"list of [step, 1|0] edges; replay must reproduce status, finishStep, collectible"},levelRules:{count:24,worlds:4,levelsPerWorld:6,unlock:"linear: clearing level N unlocks N+1; worlds open when the previous world's level 6 is cleared",fail:["touch hazard","y < bounds.yMin (fall)","x < bounds.xMin","x > bounds.xMax","timeout 60 s"],retry:"instant, no menu; fail card 600 ms then auto-restart on next press",stars:"1 = clear, 2 = time <= par2, 3 = time <= par3. Collectible is separate (does not gate stars).",parRule:"reference route = the bot win with the widest worst single-release window among wins no slower than 1.3x the fastest found; par3 = ceil0.1(refTime*1.3 + 0.5 s); par2 = ceil0.1(par3*1.5)"},camera:{landscape:{internalPx:[320,180],pxPerU:9,visibleU:[35.6,20],playerAnchorX:.35,verticalFollow:"none (full 20 u height visible)"},portrait:{internalPx:[180,320],pxPerU:9,visibleU:[20,35.6],playerAnchorX:.3,verticalFollow:"none; level band centred, 15.6 u of sky/sea above and below used for HUD",minAheadU:12},lookAhead:"targetX = player.x + clamp(vx*0.35, -3, 6)",smoothing:"critically damped spring, 0.18 s; camera never moves vertically",rule:"the full grab range (7 u) ahead of the player is always on screen; next pin is never hidden by HUD",scaling:"integer nearest-neighbour upscale of the internal canvas, letterbox with background ink"},art:{family:"Hibit-style (same family as Trayora): internal low-res canvas, nearest-neighbour, binary alpha, 1 px outline, 3-tone shading, limited palette, all drawn in code",ink:{k:"#0B0D14",n1:"#1C2233",n2:"#2C3550",n3:"#46527A",n4:"#6B78A8",n5:"#A3ADCF",n6:"#E6EAF5",W:"#FFFFFF"},inkSource:"Trayora prototype UI ink ramp (prototype/config/art-direction.json, our own work)",palettes:{lantern:{label:"Lantern (default)",player:"#FFD335",rope:"#E6EAF5",pin:"#62B2F2",pinFixed:"#915FEF",pad:"#96C07A",hazard:"#FB0000",goal:"#00F7F5",collectible:"#F21E8D",bg:"#141A2C",far:"#232B45"},okabe:{label:"Colour-blind friendly",player:"#F0E442",rope:"#E6EAF5",pin:"#56B4E9",pinFixed:"#0072B2",pad:"#009E73",hazard:"#D55E00",goal:"#E69F00",collectible:"#CC79A7",bg:"#101010",far:"#1C1C1C"},contrast:{label:"High contrast",player:"#FFFD00",rope:"#FFFFFF",pin:"#6AFFB4",pinFixed:"#BBB51E",pad:"#7BB182",hazard:"#FF76B7",goal:"#EBFFFF",collectible:"#F4BDFF",bg:"#000000",far:"#1A1A1A"}},shapeCoding:{pin:"ring 9 px",pinFixed:"ring + dotted circle of its len",pinMoving:"ring + dashed track line",pad:"chevron stripes pointing along n",hazard:"saw-tooth triangles (box) / 8-point star (circle)",goal:"beacon arch with checker band",collectible:"4-point spark",zones:{lowg:"sparse dots",updraft:"up arrows",current:"side arrows in dir",water:"wave lines"}},paletteChecks:{minContrastVsBg:3,minPairDE2000:10,cvdKinds:["protan","deutan","tritan"],gameplayKeys:["player","pin","pinFixed","pad","hazard","goal","collectible"],note:"shape coding is mandatory, colour is never the only cue"},effects:{grabSpark:{maxMs:160,maxParticles:6,maxAlpha:.8},releaseTrail:{maxMs:300,maxAlive:24,maxAlpha:.7,note:"behind the player only"},padRipple:{maxMs:220,maxAlpha:.6,minIntervalMs:400},collectBurst:{maxMs:320,maxParticles:12,maxAlpha:.8},goalBurst:{maxMs:600,maxParticles:48,maxAlpha:.8,note:"after win, input already locked"},failPuff:{maxMs:300,maxParticles:10},globalMaxAlive:64,brightPulseMinIntervalMs:400,screenShake:"removed from code (not a setting)",neverDrawOver:["pins","hazards","pads","goal","rope"],reduceEffects:"all particles off, trail off, pulses static; honours prefers-reduced-motion when setting=system",visualRng:"separate stream, never the gameplay/daily stream"},paletteSource:"slot colours reuse Trayora's CVD-checked free theme sets (harbor/okabe/contrast in design/game-config.v2.json, our own work), re-mapped to gameplay roles"},audio:{engine:"Web Audio, all synthesized at runtime, no sample files",sfx:{grab:"square 880->660 Hz, 30 ms, -18 dBFS",release:"band-passed noise swee
